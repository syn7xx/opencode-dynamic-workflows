version: 2
updates:
  # The repo is managed by Bun (bun.lock, no package-lock.json), so the npm_and_yarn
  # ecosystem cannot update it; Dependabot needs the Bun ecosystem.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Must match the zod version @opencode/plugin depends on: RPC schemas cross into OpenCode.
      - dependency-name: zod
      # The host provides these to the TUI bundle; keep them on the versions OpenCode ships.
      - dependency-name: "@opentui/*"
      - dependency-name: solid-js
      # TypeScript 7 replaces the compiler (the native port) and needs its own migration;
      # take it deliberately, not as a routine bump. Patch/minor still come through.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
